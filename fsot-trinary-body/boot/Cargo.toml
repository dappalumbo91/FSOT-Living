[package]
name = "fsot_body_boot"
version = "0.1.0"
edition = "2021"
description = "UEFI/BIOS disk image builder + optional QEMU launch for the trinary body"

[[bin]]
name = "fsot_body_boot"
path = "src/main.rs"

[dependencies]
# UEFI-only: BIOS stages fail on some Windows nightlies (build-std/core for
# i686-stage-3 / x86_64-stage-4). UEFI path is the primary QEMU body path.
bootloader = { version = "=0.11.15", default-features = false, features = ["uefi"] }
