[package]
name = "fsot_body_kernel"
version = "0.1.0"
edition = "2021"
description = "FSOT trinary genetic body — bare-metal soma"

[[bin]]
name = "fsot_body_kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bootloader_api = "=0.11.15"
libm = "0.2"
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
trinary = { path = "../trinary" }
genetic = { path = "../genetic" }
body = { path = "../body" }
