[package]
name = "fsot-living"
version = "0.1.0"
edition = "2021"
authors = ["Damian Arthur Palumbo"]
description = "FSOT-native living organism — autonomous habitat with interactive TUI"
license = "Apache-2.0"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
anyhow = "1"
image = { version = "0.25", default-features = true, features = ["png", "jpeg"] }
tempfile = "3"

[[bin]]
name = "fsot-living"
path = "src/main.rs"

[[bin]]
name = "fsot-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "fsot-tasks"
path = "src/bin/task_battery.rs"
